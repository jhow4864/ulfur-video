plugins {
    id 'com.android.application'
}

def media3Version = '1.9.4'

// Release signing (1.4.0). Keystore details live OUTSIDE the repo in a properties file
// (storeFile / storePassword / keyAlias / keyPassword), passed with -Pulfur.keystoreProperties=/path
// or the ULFUR_VIDEO_KEYSTORE_PROPERTIES env var. 1.3.0 and earlier were signed with the box's
// ~/.android/debug.keystore (CN=Android Debug, SHA-256 1f94113d...a3509e4); updates MUST keep that key
// or Android won't install them over the existing app (and the private videos would be lost on uninstall).
def keystorePropsPath = project.findProperty('ulfur.keystoreProperties') ?: System.getenv('ULFUR_VIDEO_KEYSTORE_PROPERTIES')
def keystoreProps = new Properties()
if (keystorePropsPath != null && file(keystorePropsPath).isFile()) {
    file(keystorePropsPath).withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.jamh.videoplayer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jamh.videoplayer'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4.0'

        ndk {
            // Pixels are arm64; x86_64 kept for emulators, armeabi-v7a for older phones.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile')) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps.getProperty('storeFile')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                systemProperty 'preview.dir', "${rootDir}/previews"
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
    // Prebuilt FFmpeg audio decoder extension (Jellyfin build of the Media3 ffmpeg module, GPLv3)
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
