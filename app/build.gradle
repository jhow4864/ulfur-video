plugins {
    id 'com.android.application'
}

def media3Version = '1.9.4'

// Release signing (1.4.0). Keystore details live OUTSIDE the repo in a properties file
// (storeFile / storePassword / keyAlias / keyPassword), passed with -Pulfur.keystoreProperties=/path
// or the ULFUR_VIDEO_KEYSTORE_PROPERTIES env var. 1.3.0 and earlier were signed with the box's
// ~/.android/debug.keystore (CN=Android Debug, SHA-256 1f94113d...a3509e4); updates MUST keep that key
// or Android won't install them over the existing app (and the private videos would be lost on uninstall).
def keystorePropsPath = project.findProperty('ulfur.keystoreProperties') ?: System.getenv('ULFUR_VIDEO_KEYSTORE_PROPERTIES')
def keystoreProps = new Properties()

// 1.8.0 "Upscale on export (2x)": native Real-ESRGAN on prebuilt ncnn (tools/ncnn/fetch_ncnn.sh).
// Without the ncnn directory the app still builds; the option is compiled out (feature flag).
// Prefers the size-trimmed build (tools/ncnn/build_ncnn_min.sh), else the full prebuilt release.
def ncnnMin = file("${rootDir}/third_party/ncnn-20260526-android-vulkan-min")
def ncnnDir = file(project.findProperty('ulfur.ncnnDir') ?: (ncnnMin.isDirectory() ? ncnnMin : "${rootDir}/third_party/ncnn-20260526-android-vulkan"))
def nativeUpscale = ncnnDir.isDirectory() && !(project.findProperty('ulfur.noNativeUpscale') ?: false).toBoolean()
if (keystorePropsPath != null && file(keystorePropsPath).isFile()) {
    file(keystorePropsPath).withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.jamh.videoplayer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jamh.videoplayer'
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName '1.9.2'

        // 1.8.0 feature flag: "Upscale on export (2x)" (true only when the native upscaler is built)
        buildConfigField 'boolean', 'UPSCALE_EXPORT', nativeUpscale ? 'true' : 'false'
        if (nativeUpscale) {
            externalNativeBuild {
                cmake {
                    arguments "-DNCNN_ROOT=${ncnnDir}", '-DANDROID_STL=c++_static'
                    // Only arm64: keeps the APK small (other ABIs simply don't offer the option).
                    abiFilters 'arm64-v8a'
                }
            }
        }

        ndk {
            // Pixels are arm64; x86_64 kept for emulators, armeabi-v7a for older phones.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    ndkVersion '27.2.12479018'
    buildFeatures { buildConfig true }
    if (nativeUpscale) {
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }

    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile')) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps.getProperty('storeFile')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                systemProperty 'preview.dir', "${rootDir}/previews"
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
    // Prebuilt FFmpeg audio decoder extension (Jellyfin build of the Media3 ffmpeg module, GPLv3)
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    // 1.6.0: Private videos encrypted at rest (StreamingAead AES256_GCM_HKDF_4KB, key in Android Keystore)
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    // 1.7.0: Cast to TV (Default Media Receiver). Optional at runtime: devices without Google Play
    // services simply don't show the cast button.
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
